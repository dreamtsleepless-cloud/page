<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>猫咪品种契合度精准匹配测试 (Cat Breed Matcher)</title>
  <style>
    :root {
      --primary: #059669;
      --primary-hover: #047857;
      --primary-light: #d1fae5;
      --text-main: #111827;
      --text-muted: #6b7280;
      --bg: #f8fafc;
      --card-bg: #ffffff;
      --border: #e2e8f0;
      --radius: 14px;
      --shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.05), 0 8px 10px -6px rgba(0, 0, 0, 0.04);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
    }

    body {
      background-color: var(--bg);
      color: var(--text-main);
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      padding: 20px;
    }

    .container {
      width: 100%;
      max-width: 680px;
      background: var(--card-bg);
      border-radius: var(--radius);
      box-shadow: var(--shadow);
      padding: 36px;
      position: relative;
      overflow: hidden;
      transition: all 0.3s ease;
    }

    /* 顶部进度条 */
    .progress-bar-container {
      width: 100%;
      height: 6px;
      background-color: var(--border);
      border-radius: 999px;
      margin-bottom: 24px;
      overflow: hidden;
    }

    .progress-bar {
      height: 100%;
      width: 0%;
      background: linear-gradient(90deg, #10b981, #059669);
      transition: width 0.35s ease;
    }

    /* 欢迎视图 */
    .welcome-view {
      text-align: center;
    }

    .welcome-view h1 {
      font-size: 1.85rem;
      margin-bottom: 12px;
      color: var(--text-main);
    }

    .welcome-view p {
      color: var(--text-muted);
      line-height: 1.6;
      margin-bottom: 28px;
    }

    .feature-tags {
      display: flex;
      justify-content: center;
      gap: 10px;
      margin-bottom: 30px;
      flex-wrap: wrap;
    }

    .feature-tag {
      font-size: 0.85rem;
      background: #f1f5f9;
      border: 1px solid var(--border);
      padding: 6px 14px;
      border-radius: 20px;
      color: #334155;
    }

    /* 题目样式 */
    .step-indicator {
      font-size: 0.85rem;
      font-weight: 600;
      color: var(--primary);
      text-transform: uppercase;
      letter-spacing: 0.05em;
      margin-bottom: 6px;
    }

    .question-title {
      font-size: 1.35rem;
      font-weight: 700;
      margin-bottom: 8px;
    }

    .question-desc {
      font-size: 0.9rem;
      color: var(--text-muted);
      margin-bottom: 20px;
    }

    .options-grid {
      display: flex;
      flex-direction: column;
      gap: 12px;
      margin-bottom: 28px;
    }

    .option-card {
      border: 1.5px solid var(--border);
      border-radius: 12px;
      padding: 16px 20px;
      cursor: pointer;
      display: flex;
      align-items: flex-start;
      gap: 14px;
      transition: all 0.2s ease;
      background: #ffffff;
    }

    .option-card:hover {
      border-color: #6ee7b7;
      background-color: #f0fdf4;
    }

    .option-card.selected {
      border-color: var(--primary);
      background-color: var(--primary-light);
    }

    .option-card input[type="radio"] {
      margin-top: 4px;
      accent-color: var(--primary);
      cursor: pointer;
    }

    .option-text h4 {
      font-size: 1rem;
      margin-bottom: 3px;
      font-weight: 600;
    }

    .option-text p {
      font-size: 0.85rem;
      color: var(--text-muted);
      line-height: 1.4;
    }

    /* 按钮组 */
    .btn-group {
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .btn {
      padding: 12px 24px;
      border-radius: 10px;
      font-size: 0.95rem;
      font-weight: 600;
      cursor: pointer;
      border: none;
      transition: all 0.2s;
    }

    .btn-primary {
      background: var(--primary);
      color: #ffffff;
      margin-left: auto;
    }

    .btn-primary:hover {
      background: var(--primary-hover);
    }

    .btn-secondary {
      background: transparent;
      color: var(--text-muted);
      border: 1px solid var(--border);
    }

    .btn-secondary:hover {
      background: #f1f5f9;
      color: var(--text-main);
    }

    /* 结果视图 */
    .result-view {
      display: none;
    }

    .match-hero {
      background: linear-gradient(135deg, #ecfdf5, #f0fdf4);
      border: 1px solid #a7f3d0;
      border-radius: var(--radius);
      padding: 24px;
      margin-bottom: 24px;
    }

    .hero-header {
      display: flex;
      justify-content: space-between;
      align-items: baseline;
      margin-bottom: 12px;
    }

    .hero-name {
      font-size: 1.7rem;
      font-weight: 800;
      color: #064e3b;
    }

    .hero-latin {
      font-size: 0.9rem;
      color: var(--text-muted);
      font-weight: 400;
      margin-left: 8px;
    }

    .match-badge {
      background: #047857;
      color: white;
      padding: 4px 12px;
      border-radius: 999px;
      font-size: 0.9rem;
      font-weight: 700;
    }

    .tag-container {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
      margin-bottom: 16px;
    }

    .tag {
      background: rgba(255, 255, 255, 0.85);
      border: 1px solid #a7f3d0;
      padding: 4px 10px;
      border-radius: 6px;
      font-size: 0.8rem;
      color: #065f46;
      font-weight: 500;
    }

    .result-section-title {
      font-size: 0.95rem;
      font-weight: 700;
      margin-top: 14px;
      margin-bottom: 4px;
      color: #064e3b;
    }

    .result-desc {
      font-size: 0.9rem;
      line-height: 1.6;
      color: #374151;
    }

    .warning-box {
      margin-top: 14px;
      background: #fffbeb;
      border-left: 4px solid #f59e0b;
      padding: 10px 14px;
      border-radius: 4px;
      font-size: 0.85rem;
      color: #92400e;
      line-height: 1.5;
    }

    /* 备选猫种 */
    .runner-ups-title {
      font-size: 1.1rem;
      font-weight: 700;
      margin-bottom: 12px;
    }

    .runner-ups-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
      margin-bottom: 24px;
    }

    .runner-card {
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 14px;
      background: #fdfdfe;
    }

    .runner-card h5 {
      font-size: 1rem;
      display: flex;
      justify-content: space-between;
      margin-bottom: 6px;
    }

    .runner-score {
      font-size: 0.85rem;
      color: var(--primary);
    }

    .runner-card p {
      font-size: 0.8rem;
      color: var(--text-muted);
      line-height: 1.4;
    }

    .hidden {
      display: none !important;
    }

    @media (max-width: 600px) {
      .container {
        padding: 20px;
      }
      .runner-ups-grid {
        grid-template-columns: 1fr;
      }
      .hero-header {
        flex-direction: column;
        align-items: flex-start;
        gap: 6px;
      }
    }
  </style>
</head>
<body>

  <div class="container">
    <!-- 进度条 -->
    <div id="progress-container" class="progress-bar-container hidden">
      <div id="progress-bar" class="progress-bar"></div>
    </div>

    <!-- 1. 欢迎页 -->
    <div id="welcome-view" class="welcome-view">
      <h1>猫咪品种契合度精准匹配测试</h1>
      <p>猫咪不仅有长短毛之分，更有截然不同的“狗系黏人/高冷独立”、“低敏/无毛”、“话痨/静音”以及“活动攀爬需求”。通过 7 个多维生活指标，为你找到最小颗粒度的最契合猫种。</p>
      
      <div class="feature-tags">
        <span class="feature-tag">🧬 掉毛度与低敏 (Fel d 1)</span>
        <span class="feature-tag">💬 话痨程度与静音偏好</span>
        <span class="feature-tag">🫂 狗系黏人 vs 高冷独立</span>
        <span class="feature-tag">⚠️ 遗传易感性与避坑指南</span>
      </div>

      <button class="btn btn-primary" onclick="startQuiz()">开始测试</button>
    </div>

    <!-- 2. 问卷答题区 -->
    <div id="quiz-view" class="hidden">
      <div id="step-indicator" class="step-indicator">第 1 题 / 共 7 题</div>
      <h2 id="question-title" class="question-title">题目加载中...</h2>
      <p id="question-desc" class="question-desc">补充说明</p>

      <div id="options-container" class="options-grid">
        <!-- 选项动态插入 -->
      </div>

      <div class="btn-group">
        <button id="prev-btn" class="btn btn-secondary hidden" onclick="prevQuestion()">上一题</button>
        <button id="next-btn" class="btn btn-primary" onclick="nextQuestion()">下一题</button>
      </div>
    </div>

    <!-- 3. 结果呈现区 -->
    <div id="result-view" class="result-view">
      <h2 style="font-size: 1.4rem; margin-bottom: 16px;">测试完成！最契合你的猫咪品种是：</h2>
      
      <!-- 主推猫种 -->
      <div class="match-hero">
        <div class="hero-header">
          <div>
            <span id="best-name" class="hero-name">猫种名称</span>
            <span id="best-latin" class="hero-latin">English Name</span>
          </div>
          <span id="best-score" class="match-badge">98% 契合度</span>
        </div>

        <div id="best-tags" class="tag-container"></div>

        <div class="result-section-title">✨ 为什么适合你？</div>
        <p id="best-reason" class="result-desc"></p>

        <div class="result-section-title">💡 关键养护与相处特征</div>
        <p id="best-care" class="result-desc"></p>

        <div id="best-warning" class="warning-box"></div>
      </div>

      <!-- 备选猫种 -->
      <div class="runner-ups-title">备选匹配猫种（契合度相近）</div>
      <div id="runners-container" class="runner-ups-grid"></div>

      <button class="btn btn-primary" style="width: 100%; margin-top: 10px;" onclick="restartQuiz()">重新测试</button>
    </div>
  </div>

  <script>
    // 问卷问题体系 (针对猫科特性的 7 维度)
    const questions = [
      {
        id: "shedding_allergy",
        title: "你对猫毛脱落、日常打扫及过敏的容忍度如何？",

          { label: "接受适量掉毛，但毛发打理要省心", desc: "短毛好梳理即可，定期戴手套撸毛或吸尘可以接受", val: 2 },
          { label: "极度迷恋丰厚被毛，完全不介意满屋飞毛", desc: "就是喜欢爆毛手感，愿意备好吸尘器和粘毛器", val: 3 }
        ]
      },
      {
        id: "clinginess",

        options: [
          { label: "“狗系”黏人狂魔：走哪跟哪、要抱抱、睡觉贴贴", desc: "渴望极高情感反馈，希望猫咪主动寻求身体接触", val: 1 },
          { label: "温和陪伴：静静待在同一个房间，适度互动", desc: "不喜欢太黏人打扰工作，但在旁边趴着会感到治愈", val: 2 },
          { label: "高冷独立：互不打扰的室友，尊重彼此边界", desc: "不主动求抱，性格淡定，只有它想来时才理你", val: 3 }

      {

        title: "你希望猫咪的活力水平与日常活动方式是？",

        options: [

        ]

      {

        desc: "部分高依恋感猫种容易患上分离焦虑，导致乱尿或过度舔毛。",
        options: [
          { label: "较少独处（< 4 小时 / 居家办公 / 全天有人）", desc: "白天几乎随时有人陪伴，能够满足高关注需求", val: 1 },

    // 应用交互状态
    let currentStep = 0;
    const userAnswers = {};

    function startQuiz() {
      document.getElementById('welcome-view').classList.add('hidden');
      document.getElementById('progress-container').classList.remove('hidden');
      document.getElementById('quiz-view').classList.remove('hidden');
      renderQuestion();
    }

    function renderQuestion() {
      const q = questions[currentStep];
      const total = questions.length;

      // 更新进度与题目
      document.getElementById('progress-bar').style.width = `${((currentStep + 1) / total) * 100}%`;
      document.getElementById('step-indicator').innerText = `第 ${currentStep + 1} 题 / 共 ${total} 题`;
      document.getElementById('question-title').innerText = q.title;
      document.getElementById('question-desc').innerText = q.desc;

      // 渲染选项
      const optionsContainer = document.getElementById('options-container');
      optionsContainer.innerHTML = '';

      q.options.forEach((opt) => {
        const isSelected = userAnswers[q.id] === opt.val;
        const card = document.createElement('div');
        card.className = `option-card ${isSelected ? 'selected' : ''}`;
        card.onclick = () => selectOption(q.id, opt.val, card);

        card.innerHTML = `
          <input type="radio" name="${q.id}" ${isSelected ? 'checked' : ''} />
          <div class="option-text">
            <h4>${opt.label}</h4>
            <p>${opt.desc}</p>
          </div>
        `;
        optionsContainer.appendChild(card);
      });

      // 上下题按钮
      const prevBtn = document.getElementById('prev-btn');
      if (currentStep > 0) {
        prevBtn.classList.remove('hidden');
      } else {
        prevBtn.classList.add('hidden');
      }

      const nextBtn = document.getElementById('next-btn');
      nextBtn.innerText = (currentStep === total - 1) ? '查看匹配结果' : '下一题';
    }

    function selectOption(qid, val, element) {
      userAnswers[qid] = val;
      const allCards = document.querySelectorAll('.option-card');
      allCards.forEach(c => c.classList.remove('selected'));
      element.classList.add('selected');
      const radio = element.querySelector('input[type="radio"]');
      if (radio) radio.checked = true;
    }

    function prevQuestion() {
      if (currentStep > 0) {
        currentStep--;
        renderQuestion();
      }
    }

    function nextQuestion() {
      const currentQId = questions[currentStep].id;
      if (userAnswers[currentQId] === undefined) {
        alert("请先选择一个最符合你生活习惯的选项。");
        return;
      }

      if (currentStep < questions.length - 1) {
        currentStep++;
        renderQuestion();
      } else {
        calculateAndShowResult();
      }
    }

    // 精细化多维惩罚匹配算法 (猫咪专属加权)
    function calculateAndShowResult() {
      const scoredBreeds = catBreedDatabase.map(breed => {
        let penalty = 0;

        // 1. 掉毛度与低敏惩罚 (最关键的生活断崖指标)
        if (userAnswers.shedding_allergy === 1) {
          // 用户极其严选无毛或低敏，强掉毛长毛猫重扣
          if (breed.shedding === 3) penalty += 32;
          else if (breed.shedding === 2) penalty += 16;
        } else if (userAnswers.shedding_allergy === 3) {
          // 用户极度喜欢长毛，如果匹配到无毛猫/超短毛则扣分
          if (breed.shedding === 1) penalty += 18;
        }

        // 2. 黏人模式与情感需求冲突
        const clingDiff = Math.abs(breed.cling - userAnswers.clinginess);
        penalty += clingDiff * 10;
        // 如果用户想要狗系黏人，但品种高冷独立
        if (userAnswers.clinginess === 1 && breed.cling === 3) {
          penalty += 12;
        }

        // 3. 活力跑酷与佛系躺平冲突
        const energyDiff = Math.abs(breed.energy - userAnswers.activity_energy);
        penalty += energyDiff * 9;
        // 用户想佛系，猫是永动机 (如孟加拉/阿比西尼亚)
        if (userAnswers.activity_energy === 1 && breed.energy === 3) {
          penalty += 15;
        }

        // 4. 话痨程度与静音偏好
        if (userAnswers.vocalization === 1 && breed.vocal >= 2) {
          penalty += (breed.vocal - 1) * 12;
        } else if (userAnswers.vocalization === 3 && breed.vocal === 1) {
          penalty += 10; // 想要聊天机却匹配到完全静音猫
        }

        // 5. 独处时长与分离焦虑
        if (userAnswers.alone_time === 3 && breed.alone === 1) {
          // 长时间不在家，但猫极度依赖人易抑郁
          penalty += 20;
        } else if (userAnswers.alone_time === 1 && breed.alone === 3) {
          penalty += 4;
        }

        // 6. 精细养护精力耐受
        if (userAnswers.grooming_effort === 1 && breed.care === 3) {
          // 用户想极简省心，但猫需要每天擦泪痕或洗澡擦油
          penalty += 18;
        }

        // 7. 体型偏好
        if (userAnswers.size_preference !== 0) {
          if (breed.size !== userAnswers.size_preference) {
            penalty += Math.abs(breed.size - userAnswers.size_preference) * 10;
          }
        }

        // 综合百分比拟合 (封顶 98%，保底 45%)
        let matchScore = Math.round(100 - penalty);
        matchScore = Math.max(45, Math.min(98, matchScore));

        return {
          ...breed,
          score: matchScore
        };
      });

      // 降序排序输出
      scoredBreeds.sort((a, b) => b.score - a.score);

      const topBreed = scoredBreeds[0];
      const runnerUps = scoredBreeds.slice(1, 3);

      // 切换视图
      document.getElementById('quiz-view').classList.add('hidden');
      document.getElementById('progress-container').classList.add('hidden');
      document.getElementById('result-view').style.display = 'block';

      // 渲染第一名
      document.getElementById('best-name').innerText = topBreed.name;
      document.getElementById('best-latin').innerText = topBreed.latin;
      document.getElementById('best-score').innerText = `${topBreed.score}% 契合度`;
      document.getElementById('best-reason').innerText = topBreed.reason;
      document.getElementById('best-care').innerText = topBreed.care;
      document.getElementById('best-warning').innerHTML = `<strong>⚠️ 潜在注意与避坑提示：</strong>${topBreed.warning}`;

      const tagsContainer = document.getElementById('best-tags');
      tagsContainer.innerHTML = '';
      topBreed.tags.forEach(t => {
        const span = document.createElement('span');
        span.className = 'tag';
        span.innerText = t;
        tagsContainer.appendChild(span);
      });

      // 渲染备选项 (第2、3名)
      const runnersContainer = document.getElementById('runners-container');
      runnersContainer.innerHTML = '';
      runnerUps.forEach(r => {
        const div = document.createElement('div');
        div.className = 'runner-card';
        div.innerHTML = `
          <h5><span>${r.name}</span> <span class="runner-score">${r.score}% 契合</span></h5>
          <p>${r.tags.join(' · ')}</p>
          <p style="margin-top:6px; color:#4b5563;">${r.reason.substring(0, 56)}...</p>
        `;
        runnersContainer.appendChild(div);
      });
    }

    function restartQuiz() {
      currentStep = 0;
      for (const k in userAnswers) delete userAnswers[k];
      document.getElementById('result-view').style.display = 'none';
      document.getElementById('welcome-view').classList.remove('hidden');
    }
  </script>
